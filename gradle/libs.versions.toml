[versions]
# AndroidX
core-ktx = "1.9.0"
appcompat = "1.6.1"
constraintlayout = "2.1.4"
splashscreen = "1.0.0"
lifecycle = "2.5.1"
navigation = "2.5.3"
databinding = "7.4.2"
test-junit = "1.1.5"
espresso = "3.5.1"
multidex = "2.0.1"

# Material
material = "1.8.0"

# Fragment Args
fragmentargs = "4.0.0-RC1"

# Koin
koin = "3.2.2"

# Gson
gson = "2.10.1"

# ReactiveX
rxkotlin = "3.0.1"
rxandroid = "3.0.2"
rxjava = "3.1.5"

# Coroutines
coroutines = "1.6.4"

# Gotev
speech = "1.6.2"

# Expandable Layout
expandablelayout = "1.0.7"

# Exoplayer
exoplayer = "2.18.4"

# Test
junit = "4.13.2"
threetenabp = "1.4.4"
spectrum = "0.7.1"

[libraries]
# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-databinding-runtime = { module = "androidx.databinding:databinding-runtime", version.ref = "databinding" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-multidex = { module = "com.android.support:multidex", version.ref = "multidex" }

# Material
material = { module = "com.google.android.material:material", version.ref = "material" }

# Fragment Args
fragmentargs-annotation = { module = "com.hannesdorfmann.fragmentargs:annotation", version.ref = "fragmentargs" }
fragmentargs-processor = { module = "com.hannesdorfmann.fragmentargs:processor", version.ref = "fragmentargs" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# Gson
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# ReactiveX
rxkotlin = { module = "io.reactivex.rxjava3:rxkotlin", version.ref = "rxkotlin" }
rxandroid = { module = "io.reactivex.rxjava3:rxandroid", version.ref = "rxandroid" }
rxjava = { module = "io.reactivex.rxjava3:rxjava", version.ref = "rxjava" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Gotev
speech = { module = "net.gotev:speech", version.ref = "speech" }

# Expandable Layout
expandablelayout = { module = "com.github.skydoves:expandablelayout", version.ref = "expandablelayout" }

#Exoplayer
exoplayer-core = { module = "com.google.android.exoplayer:exoplayer-core", version.ref = "exoplayer" }
exoplayer-ui = { module = "com.google.android.exoplayer:exoplayer-ui", version.ref = "exoplayer" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }

# Threeten ABP
threetenabp = { module = "com.jakewharton.threetenabp:threetenabp", version.ref = "threetenabp" }

# Spectrum
spectrum = { module = "com.thebluealliance:spectrum", version.ref = "spectrum" }

[plugins]


[bundles]
androidx = [
    "androidx-core-ktx",
    "androidx-appcompat",
    "androidx-constraintlayout",
    "androidx-splashscreen",
    "androidx-lifecycle-livedata",
    "androidx-lifecycle-viewmodel",
    "androidx-navigation-fragment",
    "androidx-navigation-ui",
    "androidx-databinding-runtime"
]