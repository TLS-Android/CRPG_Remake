plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.tiagosantos.crpg_remake'
    compileSdk 33

    defaultConfig {
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName "1.0"

        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        dev {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    implementation project(path: ':common')
    implementation project(path: ':access')
    implementation project(path: ':timelineview')

    // Fragment Args
    implementation(libs.fragmentargs.annotation)
    annotationProcessor(libs.fragmentargs.processor)

    // Material
    implementation(libs.material)

    // AndroidX
    implementation(libs.bundles.androidx) // Using the bundle!

    // Koin
    implementation(libs.koin.core)
    testImplementation(libs.koin.test)

    // Gson
    implementation(libs.gson)

    // ReactiveX
    implementation(libs.rxkotlin)
    implementation(libs.rxandroid)
    implementation(libs.rxjava)

    // Coroutines
    implementation(libs.kotlinx.coroutines.core)
    implementation(libs.kotlinx.coroutines.android)

    // Gotev
    implementation(libs.speech)

    // Expandable Layout
    implementation(libs.expandablelayout)

    // Exoplayer
    implementation(libs.exoplayer.core)
    implementation(libs.exoplayer.ui)

    // Test
    testImplementation(libs.junit)
    androidTestImplementation(libs.androidx.test.junit)
    androidTestImplementation(libs.androidx.test.espresso)

    // Threeten ABP
    implementation(libs.threetenabp)

    // Multidex
    implementation(libs.androidx.multidex)
}
